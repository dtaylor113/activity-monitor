<!--
  A Better Git Dashboard
  Built by Dave Taylor. Free to use, copy, and modify.
  See the version badge (top right, in-app) for a user-facing changelog.

  ============================================================
  FOR AI AGENTS & FUTURE DEVELOPERS — READ THIS FIRST
  ============================================================

  WHAT THIS IS
  A single-file GitHub PR dashboard. Open it in a browser, enter a GitHub
  token, point it at any repo via Settings. Shows your own open PRs (the
  "My PRs" tab) plus a team-wide PR Distribution chart with 3 tabs: Open,
  Closed, and Cycle Time.

  HARD CONSTRAINTS — do not violate these without the user explicitly
  asking to relax them:
  - MUST stay ONE sendable HTML file. No build step, no bundler, no
    package.json, no sidecar .js/.css files. Anyone should be able to
    save this one file and open it in a browser.
  - MUST NOT hardcode a GitHub username, token, or repo anywhere. `REPO`
    defaults to RedHatInsights/uhc-portal but is fully user-editable via
    the Settings modal (⚙ icon) and persisted in localStorage — every
    repo-scoped query or URL must read the live `REPO` variable, never a
    literal string.
  - MUST NOT bump `APP_VERSION` unless the user explicitly says to in
    those words. Default behavior for any change: edit/append to the
    CURRENT version's `CHANGELOG` entry instead.
  - The GitHub token lives in sessionStorage (cleared when the tab
    closes), never localStorage, never written to disk, never logged.

  ARCHITECTURE MAP (see the `// ==== SECTION ====` dividers below for
  exact boundaries of each piece):
  - State: `D` holds the current My-PRs dataset (`D.prs`, `D.pr_status`).
    The Distribution modal has no separate persisted state — it fetches
    its own point-in-time snapshot every time it's opened (see
    `distributionCache`).
  - GraphQL: every GitHub API call goes through one shared
    `graphqlRequest()` helper (POST + 401/"bad credentials" normalization
    into a thrown `{ authError: true }` so every caller's catch block
    reacts identically). 3 independent fetch paths sit on top of it:
    `fetchLiveGitData` (My PRs, scoped to @me), `fetchTeamDistribution`
    (Open tab, repo-wide open PRs), `fetchClosedPRs` (Closed + Cycle Time
    tabs, repo-wide closed PRs, paginated and capped at `CLOSED_PRS_MAX`).
  - Two custom HTML/CSS modals — Settings (repo + token) and Distribution
    (the 3-tab chart). Deliberately NOT native `prompt()`/`alert()`/
    `confirm()` anywhere in this file: those have browser-controlled
    chrome (title, an un-removable "don't show again" checkbox in some
    browsers) that can't be styled or suppressed.
  - Rendering is plain template-literal HTML strings assigned via
    `innerHTML` — no framework, no virtual DOM. `initInteractions()`
    re-binds event listeners after every re-render; elements that only
    exist once (gear icon, version badge, modal buttons) guard against
    double-binding via a `dataset.bound` flag.

  STORAGE KEY INVENTORY:
  - activity_monitor_gh_token   (sessionStorage) your GitHub token
  - activity_monitor_repo       (localStorage)   "owner/name" being viewed
  - activity_monitor_gh_login   (localStorage)   your GitHub login
  - activity_monitor_gh_name    (localStorage)   your profile display name, if GitHub has one on file
  - git_live_data_cache         (localStorage)   last My-PRs fetch (PRs + status), hydrates the page on reload
  - pr_comments_seen            (localStorage)   per-PR "last seen" bookmark, drives the unread-comment badge

  CONVENTIONS
  - Every non-obvious decision gets an inline comment explaining WHY, not
    just what. If you're about to delete or "simplify" a comment-heavy
    block, read the comment first — it's very likely there because an
    earlier, simpler version of that exact code was wrong in a way that
    only became obvious once it broke against real GitHub data.
  - Pure/testable logic (computeDistribution, computeClosedDistribution,
    simplifyReviewers, formatRelativeAge, etc.) is kept free of DOM/fetch
    calls specifically so it can be unit-tested via jsdom without a real
    browser, network call, or build step.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Activity</title>
<!-- All 4 CDN scripts below are pinned to an exact version + SRI hash
     (integrity + crossorigin) rather than a floating "@3"/"@4"/unversioned
     tag. This closes the main realistic attack path for a file that holds
     a GitHub token in sessionStorage: if jsDelivr (or the npm package
     behind it) were ever compromised and started serving altered content,
     the browser refuses to execute a script whose hash doesn't match,
     instead of silently running attacker code with page-level access to
     that token. Tradeoff: upgrades no longer happen automatically — bump
     the version AND regenerate the hash together (see date below), e.g.:
       curl -sL -o lib.js "<jsdelivr URL for exact new version>"
       openssl dgst -sha384 -binary lib.js | openssl base64 -A
     Verified working together and hashes confirmed correct 2026-09-30. -->
<!-- GFM rendering for comment bodies (tables, fenced code, lists, etc.).
     marked v18 ships no pre-minified UMD build on npm — the unminified
     file is used deliberately; jsDelivr's on-the-fly ".min.js" for this
     package is dynamically re-generated per request (its own banner warns
     "Do NOT use SRI with dynamically generated" files), which would make
     the hash below unstable. -->
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"
        integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo"
        crossorigin="anonymous"></script>
<!-- Sanitizes marked.js output before it hits innerHTML — comment bodies
     are untrusted (anyone who can comment on a tracked PR), and marked.js
     itself does not sanitize raw HTML embedded in markdown source. -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
        integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
        crossorigin="anonymous"></script>
<!-- Renders the team PR-distribution stacked bar chart (Distribution
     button on the PRs table). Loaded upfront like the two libs above,
     even though it's only used after a click — same simple strategy,
     avoids async-script-load race conditions if the button is clicked
     right after page load. The GraphQL query it depends on is NOT
     fetched upfront though — see openDistributionModal() — only this
     ~200KB rendering library is preloaded, not the API call itself. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
        integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
        crossorigin="anonymous"></script>
<!-- Renders the numeric value inside each stacked-bar segment on the
     Distribution chart — Chart.js has no built-in data-label rendering,
     this is the official plugin for it. Auto-registers itself globally
     once loaded, so no explicit Chart.register() call is needed below. -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"
        integrity="sha384-y49Zu59jZHJL/PLKgZPv3k2WI9c0Yp3pWB76V8OBVCb0QBKS8l4Ff3YslzHVX76Y"
        crossorigin="anonymous"></script>
<style>

.focus-mode-toggle { background: transparent; border: 1px solid rgba(134, 239, 172, 0.3); color: #86efac; font-size: 12px; padding: 5px 14px; border-radius: 14px; cursor: pointer; margin-left: 6px; vertical-align: middle; position: relative; }

/* Custom tooltip (not the native title attribute) — native tooltips have

   shows the instant :hover applies, with only a quick fade transition. */
.focus-mode-toggle[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a1a;
  border: 1px solid #333;

/* height is set explicitly (not left to aspect-ratio) so small-count

<body>
<div id="app"></div>
<script>
// Fully standalone — this file has no sidecar-file dependency. All PR data
// comes from a live GraphQL fetch (see "LIVE GITHUB DATA" below), and "my
// username" is resolved from the token itself (GraphQL `viewer.login`) the
// first time it's used, not from any seed file. Sending just this one file
// to someone else, who enters their own token, works with zero setup.
// chartjs-plugin-datalabels' UMD build only exposes a global
// ChartDataLabels object — it does NOT self-register with Chart.js despite
// being loaded via a plain <script> tag. Without this call, the
// options.plugins.datalabels config on the Distribution chart is inert.
if (typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined') {
  // Neither Chart.js nor the datalabels plugin has a built-in "underline
  // this text" option (canvas text has no text-decoration concept) — this
  // custom plugin draws a short line under each rendered segment value,
  // sized to the actual measured text width so it doesn't just guess a
  // fixed width. Font here must stay in sync with the datalabels `font`
  // option below (bold, default ~12px) or the underline will be
  // noticeably wider/narrower than the number it's under.
  const valueUnderlinePlugin = {
    id: 'valueUnderline',
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      chart.data.datasets.forEach((dataset, datasetIndex) => {
        const meta = chart.getDatasetMeta(datasetIndex);
        if (meta.hidden) return;
        meta.data.forEach((element, index) => {
          const value = dataset.data[index];
          if (!value) return; // matches datalabels' formatter: v>0 ? v : ''
          // element.y/element.base order isn't guaranteed by direction —
          // normalize to top/bottom explicitly rather than assuming which
          // one is numerically smaller.
          const top = Math.min(element.y, element.base);
          const bottom = Math.max(element.y, element.base);
          const segmentHeight = bottom - top;
          // A short segment (small count relative to the chart's scale)
          // has no room for a number + gap + underline without the line
          // bleeding into the segment stacked below it — skip the
          // underline entirely rather than draw it somewhere wrong. The
          // number itself (drawn by chartjs-plugin-datalabels) still
          // shows regardless.
          if (segmentHeight < 20) { return; }
          ctx.save();
          ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          const textWidth = ctx.measureText(String(value)).width;
          const centerY = (top + bottom) / 2;
          const underlineY = Math.min(centerY + 7, bottom - 3);
          ctx.strokeStyle = '#0a0a0a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(element.x - textWidth / 2, underlineY);
          ctx.lineTo(element.x + textWidth / 2, underlineY);
          ctx.stroke();
          ctx.restore();
        });
      });
    }
  };
  Chart.register(ChartDataLabels, valueUnderlinePlugin);
}

// ==== SECTION: CORE STATE & CONSTANTS ====
const D = { prs: [], pr_status: {} };
const JIRA = 'https://redhat.atlassian.net/browse/';
// Bump this at significant milestones (new features, breaking layout/data
// changes) — shown in the masthead so anyone using a sent-around copy of
// this file can tell at a glance if they're on an old version.
const APP_VERSION = '1.9';
// Short (1-2 sentence) human-written summary of each version, shown in a
// popover when the version badge is clicked. This can't be generated from
// git at runtime — a standalone HTML file opened by a coworker has no repo
// or git access at all — so it's manually curated here each time
// APP_VERSION is bumped. Newest first.
const CHANGELOG = {
  '1.9': 'No behavior changes — added structured guidance for AI agents/future developers: hard constraints, an architecture map, a storage-key inventory, and section dividers throughout the code, so this file is easier to pick up cold.',
  '1.8': 'Distribution chart now has 3 tabs: Open (unchanged), Closed (merged vs. abandoned PRs per author, last 6 months), and Cycle Time (average + median days-to-merge per month).',
  '1.7': 'UX styling changes, incl. showing your full name (when GitHub has one on file) in the header title and the Distribution chart.',
  '1.6': 'Replaced the token popup with a Settings modal (⚙ icon) that also lets you point this dashboard at any repo. Focus Mode now also shows PRs with unread comments.',
  '1.5': 'Pinned all 4 CDN scripts to exact versions with integrity hashes, so a compromised CDN can no longer silently run altered code in this page.',
  '1.4': 'Added a "Focus Mode" button — filters the PR table down to just PRs you authored or are waiting for your review.',
  '1.3': 'Shows a "tested-by-all" tag under the author when a PR has that GitHub label — the closest signal we have to a Jira QA Contact assignment.',
  '1.2': 'Added a team Distribution chart. Click any bar to open matching PRs on GitHub. Version number is now clickable to view this changelog.',
  '1.1': 'Fixed PR sort order and a timezone bug showing wrong ages. Your username is now highlighted in purple. Data auto-refreshes on page load.',
  '1.0': 'Initial single page git dashboard. Live-fetches your open, reviewing, and approved PRs into one table via the GitHub API. Includes per-PR comment threads and a "my comments" filter. Fully self-contained — works for anyone with their own GitHub token, no build step or server needed.'
};

// Derived from REPO (not a fixed string) so switching repos via Settings
// immediately changes where every PR link points — see REPO below.
function ghLink(n) { return `<a href="https://github.com/${REPO}/pull/${n}">#${n}</a>`; }
// Used by the Distribution chart's segment clicks. GitHub search does NOT
// support ORing different qualifiers together (verified live: "author:X OR
// review-requested:X" returns 0 hits even when each alone has results).
// That used to force an approximation when "# Reviews" was one merged
// number (reviewed-by: and review-requested: are mutually exclusive
// states, so linking to either one alone dead-ended for whichever people
// happened to be in the other state). Fixed properly by splitting the
// chart into 3 segments instead of 2 (Reviewed / Pending / Created), each
// counted from exactly one qualifier — see computeDistribution() and
// DATASET_QUALIFIERS in openDistributionModal(). No more approximation:
// every segment's count and its link now come from the same query.
function githubPrSearchUrl(qualifier, login, isBot, baseQuery) {
  // GitHub Apps need an "app/" prefix in search qualifiers — their GraphQL
  // login (e.g. "red-hat-konflux") doesn't match by itself. Confirmed live
  // across all qualifiers we use (author:, reviewed-by:, review-
  // requested:) — regular users never use this prefix.
  const target = isBot ? `app/${login}` : login;
  // baseQuery defaults to the Open-tab's query; Closed/Cycle-Time pass
  // their own (is:merged / is:closed is:unmerged, with a closed:>= date
  // bound) rather than this function hardcoding is:open.
  const base = baseQuery || 'is:pr is:open';
  return `https://github.com/${REPO}/pulls?q=${encodeURIComponent(`${base} ${qualifier}:${target}`)}`;
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Highlights "you" (the current viewer) wherever your own username appears
// as a name, not a status — the Author column and comment authorship.
// Deliberately not green/red/amber/gray: those are all already spoken for
// by review/check states (approved/failing/pending/dismissed) elsewhere in
// this file, so reusing one here would make it ambiguous at a glance.
const MY_NAME_COLOR = '#c084fc';
// Shared between the Focus Mode button's initial render and its toggle
// handler (see initInteractions) so the two can never drift out of sync.
const FOCUS_MODE_TOOLTIP = 'Shows only PRs you authored, are waiting for your review, or have unread comments';
// ==== SECTION: FORMATTING HELPERS ====
function highlightIfMe(name, myUser) {
  return name === myUser ? `<span style="color:${MY_NAME_COLOR};">${esc(name)}</span>` : esc(name);
}

// Shared relative-age formatter — used for both the PR "Created" column and
// the comments-summary "latest from" line, so the two stay consistent.
// Same calendar day -> hours ago; exactly one calendar day back ->
// "Yesterday"; older -> "N days ago". Calendar-day (not raw ms/24h) based,
// so 11:58pm-yesterday vs 12:02am-today correctly reads "Yesterday" rather
// than "0 days ago".
function formatRelativeAge(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '—';
  const now = new Date();
  const startOfDay = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dayDiff = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if (dayDiff <= 0) {
    const hours = Math.floor((now - d) / 3600000);
    if (hours <= 0) return 'just now';
    if (hours === 1) return '1 hour ago';
    return `${hours} hours ago`;
  }
  if (dayDiff === 1) return 'Yesterday';
  return `${dayDiff} days ago`;
}

// Shared by the initial render and the "Only my comments" filter handler —
// "latest" is always whatever the first (newest) *currently visible* comment
// is, so checking that filter naturally turns this into "latest from me"
// with no separate code path.
function formatCommentsSummary(shownCount, total, latestWho, latestWhen) {
  const countText = shownCount === total ? `${total} comments` : `${shownCount} of ${total} comments`;
  if (!latestWho) return countText;
  return `${countText} · latest from ${esc(latestWho)} ${formatRelativeAge(latestWhen)}`;
}

if (window.marked) marked.setOptions({ gfm: true, breaks: true });

// Renders a raw GitHub comment body as full GitHub-Flavored Markdown (code
// fences, inline code, tables, lists, blockquotes, links, bold/italic) via
// marked.js. Embedded <img> HTML tags (GitHub's pasted-screenshot markup)
// are pulled out first and re-inserted as sized thumbnail links afterward,
// since marked would otherwise pass the raw tag through unstyled. The final
// output is run through DOMPurify — comment bodies are untrusted content
// (anyone who can comment on a tracked PR controls this string), and
// marked.js has no built-in HTML sanitization of its own.
function formatCommentBody(text) {
  if (!text) return '';
  const imgMap = {};
  let imgCount = 0;
  const withTokens = text.replace(/<img\b[^>]*>/gi, (tag) => {
    const srcMatch = tag.match(/src="([^"]+)"/i);
    if (!srcMatch) return '';
    const altMatch = tag.match(/alt="([^"]*)"/i);
    const token = `@@IMG${imgCount}@@`;
    const altText = esc(altMatch && altMatch[1] ? altMatch[1] : 'image');
    imgMap[token] = `<a href="${esc(srcMatch[1])}" target="_blank" rel="noopener"><img src="${esc(srcMatch[1])}" alt="${altText}" title="${altText}" style="max-width:240px;max-height:160px;border:1px solid #374151;border-radius:4px;vertical-align:top;margin:2px 0;display:block;"></a>`;
    imgCount++;
    return token;
  });
  // Fall back to plain escaped text (preserving line breaks) if the marked
  // CDN failed to load — e.g. opened offline.
  let html = window.marked
    ? marked.parse(withTokens)
    : esc(withTokens).replace(/\r?\n/g, '<br>');
  for (const token of Object.keys(imgMap)) {
    html = html.split(token).join(imgMap[token]);
  }
  if (window.DOMPurify) html = DOMPurify.sanitize(html);
  return html;
}

// Unread-comment tracking: remembers, per PR, the timestamp of the newest
// comment visible the last time you expanded that PR's comment thread.
// Anything newer than that bookmark counts as "unread".
const COMMENTS_SEEN_KEY = 'pr_comments_seen';
function getCommentsSeenMap() {
  try { return JSON.parse(localStorage.getItem(COMMENTS_SEEN_KEY) || '{}'); } catch (e) { return {}; }
}
function getCommentSeenUpTo(prNumber) {
  return getCommentsSeenMap()[String(prNumber)] || '';
}
function markCommentsSeen(prNumber, upToWhen) {
  const map = getCommentsSeenMap();
  map[String(prNumber)] = upToWhen;
  localStorage.setItem(COMMENTS_SEEN_KEY, JSON.stringify(map));
}

// ==== SECTION: MY PRs — TABLE RENDERING ====

// Pure (no DOM), same testability goal as the compute* functions in the
// Distribution section — total unread comment count across a list of
// PRs, reusing the exact same "newer than last seen" rule as the per-row
// unread badge (see getCommentSeenUpTo). Used for the header-level
// "Unread comments (n)" summary badge.
function countUnreadComments(prs) {
  return (prs || []).reduce((total, pr) => {
    const seenUpTo = getCommentSeenUpTo(pr.number);
    const unread = (pr.comments || []).filter(c => (c.when || '') > seenUpTo).length;
    return total + unread;
  }, 0);
}

// Recomputes and updates the header's "Unread comments (n)" badge in
// place — called after any comment-thread expansion marks comments as
// seen, since that only removes that one row's own badge (see
// initInteractions' toggle handler) without re-rendering the whole page.
// Without this, the header total would go stale the moment any PR's
// comments were read.
function refreshUnreadTotalBadge() {
  const total = countUnreadComments(D.prs);
  const badge = document.getElementById('unread-total-badge');
  if (!badge) return; // nothing to update if it was never rendered (started at 0)
  if (total > 0) badge.textContent = `Unread comments (${total})`;
  else badge.remove();
}

function renderPRs() {
  const myUser = getMyGithubLogin();
  const byPrNumberAsc = (a, b) => a.number - b.number;

  const myPRs = D.prs.filter(pr => pr.author === myUser);
  const otherRelevant = D.prs.filter(pr => {
    if (pr.author === myUser) return false;
    const st = D.pr_status && D.pr_status[pr.number];
    return !!(st && st.reviewers && st.reviewers.some(r => r.user === myUser));
  });
  const allPRs = myPRs.concat(otherRelevant).sort(byPrNumberAsc);

  if (!allPRs.length) {
    return `<h3>My PRs</h3><div style="color:#6b7280;">No open PRs.</div>`;
  }

  const draftCount = allPRs.reduce((n, pr) => {
    const st = D.pr_status && D.pr_status[pr.number];
    return n + (st && st.draft ? 1 : 0);
  }, 0);
  const totalUnread = countUnreadComments(allPRs);

  let html = `<h3 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;"><span>My PRs`;
  if (totalUnread > 0) {
    html += ` <span id="unread-total-badge" class="unread-total-badge">Unread comments (${totalUnread})</span>`;
  }
  if (draftCount) {
    html += ` <button class="draft-toggle" data-draft-table="prs-table">Show Draft PRs (${draftCount})</button>`;
  }
  html += ` <button class="pr-comments-toggle" data-table="prs-table">Expand All Comments</button>`;
  html += ` <label style="font-weight:normal;font-size:12px;cursor:pointer;margin-left:6px;"><input type="checkbox" class="my-comments-filter" data-table="prs-table" style="vertical-align:middle;margin-right:3px;">Show only my comments</label>`;
  html += ` <button class="focus-mode-toggle" data-table="prs-table" data-tooltip="${esc(FOCUS_MODE_TOOLTIP)}">Focus Mode</button></span>`;
  html += `<button id="pr-distribution-btn" class="pr-distribution-btn" title="Team PR distribution">📊 PR Distribution</button>`;
  html += `</h3>`;
  html += renderPRTable(allPRs, 'prs-table', myUser);

  return html;
}

function renderPRTable(prs, tableId, myUser) {
  // .hide-drafts is present by default — CSS (see <style>) hides any row
  // (and its comment sub-row) carrying .pr-draft-row until the "Show Draft
  // PRs" button removes this class. A single table with hidden rows (vs.
  // a second physical table) means sorting always covers draft rows too.
  let html = `<table id="${tableId}" class="hide-drafts"><thead><tr>`;
  ['PR','Title','Author','Reviewers','Checks','Created'].forEach(h => {
    // Rows are pre-sorted by PR number ascending; reflect that in the
    // header so it's not visually indistinguishable from an unsorted table.
    const isSortedCol = h === 'PR';
    // Reviewers/Checks cells hold badge/icon markup with no meaningful
    // string ordering — don't offer sort on those columns.
    const noSort = h === 'Reviewers' || h === 'Checks';
    const cls = [isSortedCol && 'sorted', noSort && 'no-sort'].filter(Boolean).join(' ');
    html += `<th${cls ? ` class="${cls}"` : ''}>${h}<span class="sort-indicator">${noSort ? '' : (isSortedCol ? '▲' : '⇅')}</span><div class="resize-handle"></div></th>`;
  });
  html += `</tr></thead><tbody>`;
  prs.forEach(pr => {
    const st = (D.pr_status && D.pr_status[pr.number]) || {};
    const authorHtml = highlightIfMe(pr.author, myUser) + testedByAllBadge(pr.labels);
    const reviewHtml = renderReviewers(st.reviewers);
    const checksHtml = renderChecksBadge(st.checks || 'unknown');
    const mergeHtml = renderMergeStatus(st.mergeable_state || '');
    const statusHtml = mergeHtml ? checksHtml + '<br>' + mergeHtml : checksHtml;
    const titleDisplay = (st.draft ? '[DRAFT] ' : '') + (pr.title || '');
    const createdRaw = pr.created || pr.updated || '';
    const createdAge = formatRelativeAge(createdRaw);
    const commitLine = st.lastCommitAt
      ? `<br><span style="color:#6b7280;font-size:11px;">code changed: ${formatRelativeAge(st.lastCommitAt)}</span>`
      : '';
    // Computed up front (not just inside the comments sub-row block below)
    // because Focus Mode's eligibility check needs unreadCount too.
    const comments = (pr.comments || []).slice().sort((a, b) => (b.when || '').localeCompare(a.when || ''));
    const seenUpTo = getCommentSeenUpTo(pr.number);
    const unreadCount = comments.filter(c => (c.when || '') > seenUpTo).length;
    // Focus Mode relevance: PRs I authored, PRs where I'm currently
    // waiting to review (pending — not already approved/commented/etc.),
    // or ANY PR with unread comments — someone could've commented on a PR
    // I already approved, and that still needs my attention. Rows failing
    // this get tagged .pr-not-focus, hidden only once Focus Mode is
    // toggled on (see CSS) — independent of the draft-row class.
    const isMine = pr.author === myUser;
    const isPendingMine = (st.reviewers || []).some(r => r.user === myUser && r.state === 'pending');
    const hasUnread = unreadCount > 0;
    const focusClass = (isMine || isPendingMine || hasUnread) ? '' : 'pr-not-focus';
    const rowClass = [st.draft && 'pr-draft-row', focusClass].filter(Boolean).join(' ');
    // data-sort-value: displayed text ("14 days ago", "Yesterday") doesn't
    // sort correctly as a string — sortTable() prefers this raw value when
    // present. PR numbers have the same problem ("#9" vs "#10" as text).
    html += `<tr${rowClass ? ` class="${rowClass}"` : ''}><td class="nowrap" data-sort-value="${pr.number}">${ghLink(pr.number)}</td><td>${esc(titleDisplay)}${commitLine}</td><td>${authorHtml}</td><td>${reviewHtml}</td><td class="nowrap">${statusHtml}</td><td class="nowrap" data-sort-value="${esc(createdRaw)}">${createdAge}</td></tr>`;
    if (comments.length) {
      html += `<tr class="pr-comments"><td></td><td colspan="5">`;
      const pageSize = 10;
      const detailId = `comments-${tableId}-${pr.number}`;
      const unreadBadge = unreadCount > 0 ? ` <span class="unread-badge">${unreadCount} new</span>` : '';
      // comments[0] is the newest (sorted above) — same "latest of what's
      // currently visible" concept the filter handler recomputes below.
      const summaryText = formatCommentsSummary(comments.length, comments.length, comments[0].who, comments[0].when);
      html += `<details data-pr-comments="${pr.number}"><summary><span class="comments-count-label" data-total="${comments.length}">${summaryText}</span>${unreadBadge}</summary>`;
      html += `<table id="${detailId}" style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;margin:4px 0 0;"><tbody>`;
      let lastDate = '';
      comments.forEach((c, i) => {
        const dateOnly = (c.when || '').slice(0, 10);
        const showDate = dateOnly !== lastDate;
        lastDate = dateOnly;
        const hidden = i >= pageSize;
        html += `<tr data-comment-user="${esc(c.who)}" data-date="${esc(dateOnly)}" data-when="${esc(c.when || '')}" style="vertical-align:top;${hidden ? 'display:none;' : ''}"${hidden ? ' data-page-hidden="1"' : ''}>`;
        html += `<td class="comment-date-cell" style="width:70px;color:#6b7280;white-space:nowrap;padding:${showDate ? '6px' : '2px'} 8px 2px 0;border:none;">${showDate ? esc(dateOnly) : ''}</td>`;
        html += `<td style="width:110px;color:#60a5fa;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:${showDate ? '6px' : '2px'} 8px 2px 0;border:none;">${highlightIfMe(c.who, myUser)}</td>`;
        html += `<td class="comment-body" style="color:#9ca3af;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;padding:${showDate ? '6px' : '2px'} 0 2px 0;border:none;">${formatCommentBody(c.body)}</td>`;
        html += `</tr>`;
      });
      html += `</tbody></table>`;
      if (comments.length > pageSize) {
        html += `<button class="load-more-comments" data-target="${detailId}" data-page-size="${pageSize}" style="margin:6px 0;background:transparent;border:1px solid rgba(165,180,252,0.3);color:#a5b4fc;font-size:12px;padding:5px 14px;border-radius:14px;cursor:pointer;">Load more (${comments.length - pageSize} remaining)</button>`;
      }
      html += `</details>`;
      html += `</td></tr>`;
    }
  });
  html += `</tbody></table>`;
  return html;
}

function testedByAllBadge(labels) {
  if (!labels || !labels.includes(TESTED_BY_ALL_LABEL)) return '';
  return `<br><span style="display:inline-block;margin-top:2px;padding:1px 6px;border-radius:10px;background:#374151;color:#d1d5db;font-size:10px;">${TESTED_BY_ALL_LABEL}</span>`;
}

function renderReviewers(reviewers) {
  if (!reviewers || !reviewers.length) return `<span style="color:#6b7280;">—</span>`;
  const stateMap = {
    approved: {icon: '✓', color: '#22c55e'},
    changes_requested: {icon: '✗', color: '#ef4444'},
    commented: {icon: '💬', color: '#f59e0b'},
    pending: {icon: '⏳', color: '#6b7280'},
    dismissed: {icon: '⊘', color: '#6b7280'}
  };
  return reviewers.map(r => {
    const s = stateMap[r.state] || stateMap.pending;
    return `<span style="color:${s.color};white-space:nowrap;" title="${r.state}">${s.icon} ${esc(r.user)}</span>`;
  }).join(' <span style="color:#374151;">│</span> ');
}

function renderChecksBadge(status) {
  if (status === 'passing') return `<span style="color:#22c55e;">● passing</span>`;
  if (status === 'failing') return `<span style="color:#ef4444;">● failing</span>`;
  if (status === 'pending') return `<span style="color:#f59e0b;">● pending</span>`;
  return `<span style="color:#6b7280;">—</span>`;
}
function renderMergeStatus(state) {
  if (state === 'clean') return `<span style="color:#22c55e;" title="Ready to merge">✓ mergeable</span>`;
  if (state === 'blocked') return `<span style="color:#f59e0b;" title="Merge blocked (branch protection rules)">⊘ blocked</span>`;
  if (state === 'dirty') return `<span style="color:#ef4444;" title="Merge conflicts">⚠ conflicts</span>`;
  if (state === 'unstable') return `<span style="color:#f59e0b;" title="Checks failing but mergeable">● unstable</span>`;
  return '';
}

// ============================================================
// LIVE GITHUB DATA — this file's only data source. Triggered manually via
// the "Refresh" button; a GitHub GraphQL fetch using a
// token entered once (see the Settings modal, openSettingsModal below). No
// server, no seed file, no gather.sh/assemble.py — this replaces what a
// prior version of this dashboard fetched server-side for the GitHub
// portion.
// ============================================================

// ==== SECTION: STORAGE KEYS, REPO CONFIG & SETTINGS MODAL ====
const GH_TOKEN_KEY = 'activity_monitor_gh_token';
const GIT_LIVE_CACHE_KEY = 'git_live_data_cache';
// REPO is deliberately `let`, not `const` — it's user-editable via the
// Settings modal (⚙ icon next to the version number) so this dashboard can
// point at ANY owner/repo, not just the one it was originally built for.
// Persisted in localStorage (not sensitive, unlike the token) so it's
// remembered across sessions on this device. Every ${REPO} usage below
// reads this variable live, so changing it takes effect immediately.
const REPO_KEY = 'activity_monitor_repo';
const DEFAULT_REPO = 'RedHatInsights/uhc-portal';
let REPO = localStorage.getItem(REPO_KEY) || DEFAULT_REPO;
function setRepo(value) {
  const trimmed = (value || '').trim();
  REPO = trimmed || DEFAULT_REPO;
  localStorage.setItem(REPO_KEY, REPO);
}

// D.prs/D.pr_status are populated exclusively from a live GraphQL fetch,
// cached here so a page reload doesn't force a re-fetch.
function getGitLiveCache() {
  try {
    const raw = localStorage.getItem(GIT_LIVE_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setGitLiveCache(prsList, prStatus) {
  localStorage.setItem(GIT_LIVE_CACHE_KEY, JSON.stringify({ prsList, prStatus, fetchedAt: new Date().toISOString() }));
}

// "My" GitHub username is resolved from the token via GraphQL `viewer.login`
// on first fetch (see fetchLiveGitData) — never hardcoded, never read from a
// seed file. Cached in localStorage (a username isn't sensitive) so it's
// still known on a page reload that hydrates from the PR data cache above
// without hitting the network again.
const MY_LOGIN_KEY = 'activity_monitor_gh_login';
function getMyGithubLogin() { return localStorage.getItem(MY_LOGIN_KEY) || ''; }
function setMyGithubLogin(login) { localStorage.setItem(MY_LOGIN_KEY, login); }

// Same idea as MY_LOGIN_KEY, but for the viewer's profile display name
// (GitHub's optional "name" field) — used only for the header title, which
// falls back to the login when a name isn't set (see renderPage).
const MY_NAME_KEY = 'activity_monitor_gh_name';
function getMyGithubName() { return localStorage.getItem(MY_NAME_KEY) || ''; }
function setMyGithubName(name) {
  if (name) localStorage.setItem(MY_NAME_KEY, name);
  else localStorage.removeItem(MY_NAME_KEY);
}

// Bot filter — applied to both comments and reviewers. (The old Python code
// had two different lists here by historical accident; unified into one.)
const BOT_USERS = new Set(['codecov[bot]', 'coderabbitai[bot]', 'github-actions[bot]', 'dependabot[bot]', 'codecov', 'coderabbitai', 'sourcery-ai[bot]', 'sourcery-ai']);

// sessionStorage (not localStorage) for the token specifically — it clears
// when the tab closes instead of persisting indefinitely as plaintext on
// disk. The PR data cache below stays in localStorage (non-sensitive), so
// you still only re-enter the token once per browser session, not per PR.
function getGithubToken() { return sessionStorage.getItem(GH_TOKEN_KEY) || ''; }
function setGithubToken(t) { sessionStorage.setItem(GH_TOKEN_KEY, t); }
function clearGithubToken() { sessionStorage.removeItem(GH_TOKEN_KEY); }

// Settings modal (Repo + GitHub Token) — replaces an older window.prompt()
// based flow entirely. Two reasons: (1) native prompt()/alert()/confirm()
// dialogs triggered programmatically (e.g. by the page-load auto-fetch,
// with no direct click) get throttled by the browser after repeated calls
// — Chrome adds its own "Don't show this again" checkbox and eventually
// blocks the dialog outright, which a page can't opt out of while still
// using prompt(). A custom modal isn't a native dialog, so it's never
// subject to that. (2) it also needed a 2nd field once Repo became
// user-editable — prompt() has no way to collect two separate inputs.
function ensureSettingsModal() {
  if (document.getElementById('settings-overlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'settings-overlay';
  overlay.innerHTML = `<div id="settings-modal">
    <button id="settings-close" title="Close">✕</button>
    <h2>Settings</h2>
    <label class="settings-label" for="settings-repo-input">Repo (owner/name)</label>
    <input id="settings-repo-input" type="text" placeholder="${esc(DEFAULT_REPO)}" autocomplete="off" spellcheck="false">
    <label class="settings-label" for="settings-token-input">GitHub Personal Access Token</label>
    <input id="settings-token-input" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false">
    <div id="settings-hint">Use a fine-grained, read-only, single-repo token if possible — needs read access to pull requests/checks on the repo above. Token lives only in this browser tab's sessionStorage (cleared when the tab closes) and is sent only to api.github.com. Repo is remembered on this device.</div>
    <div id="settings-status"></div>
    <button id="settings-save-btn" class="git-live-btn">Save</button>
    <div id="settings-credit">Built by Dave Taylor — free to use, copy, and modify.</div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSettingsModal(); });
  document.getElementById('settings-close').addEventListener('click', closeSettingsModal);
  document.getElementById('settings-save-btn').addEventListener('click', saveSettings);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeSettingsModal();
  });
}

function openSettingsModal(statusMessage) {
  ensureSettingsModal();
  document.getElementById('settings-repo-input').value = REPO;
  document.getElementById('settings-token-input').value = getGithubToken();
  const statusEl = document.getElementById('settings-status');
  statusEl.textContent = statusMessage || '';
  statusEl.style.color = '#f59e0b';
  document.getElementById('settings-overlay').classList.add('open');
}

function closeSettingsModal() {
  const overlay = document.getElementById('settings-overlay');
  if (overlay) overlay.classList.remove('open');
}

function saveSettings() {
  const repoInput = document.getElementById('settings-repo-input').value.trim();
  const tokenInput = document.getElementById('settings-token-input').value.trim();
  const repoChanged = !!repoInput && repoInput !== REPO;

  if (tokenInput) setGithubToken(tokenInput); else clearGithubToken();

  if (repoChanged) {
    setRepo(repoInput);
    // The PR cache was fetched for the OLD repo — stale and wrong for the
    // new one, so it must be dropped rather than briefly shown under the
    // new REPO before the next refresh overwrites it.
    localStorage.removeItem(GIT_LIVE_CACHE_KEY);
    D.prs = [];
    D.pr_status = {};
  }

  closeSettingsModal();
  renderPage();
  if (getGithubToken()) handleGitLiveRefresh();
}

// Reviewer state is the raw GitHub API value — each reviewer's latest
// PullRequestReview.state, plus "pending" for anyone requested who hasn't
// reviewed yet. No custom overrides, no derived "ball in your court" logic.
// ==== SECTION: GRAPHQL — MY PRs (LIVE FETCH) ====
// Also defines the shared graphqlRequest() helper (below), used by every
// GraphQL fetch path in this file, not just this one.
function simplifyReviewers(reviews, prAuthor, requestedLogins) {
  const latestByUser = {};
  for (const rev of reviews) {
    if (!rev.user || rev.user === prAuthor) continue;
    latestByUser[rev.user] = rev.state; // reviews arrive oldest-first; last write wins
  }
  const requestedSet = new Set(requestedLogins);
  const reviewers = Object.entries(latestByUser).map(([user, state]) => {
    state = state.toLowerCase();
    // GitHub dismisses a review's own state (not just the PR's overall
    // reviewDecision) when new commits invalidate it. If the user is back
    // in the requested-reviewers list, that means awaiting a fresh review —
    // show "pending" rather than the stale "dismissed" state.
    if (state === 'dismissed' && requestedSet.has(user)) state = 'pending';
    return { user, state };
  });
  const existingUsers = new Set(reviewers.map(r => r.user));
  for (const user of requestedLogins) {
    if (!existingUsers.has(user)) reviewers.push({ user, state: 'pending' });
  }
  return reviewers;
}

function mapChecksStatus(rollupState) {
  if (!rollupState) return 'unknown';
  if (rollupState === 'FAILURE' || rollupState === 'ERROR') return 'failing';
  if (rollupState === 'PENDING' || rollupState === 'EXPECTED') return 'pending';
  if (rollupState === 'SUCCESS') return 'passing';
  return 'unknown';
}

// Full per-PR enrichment fields, requested inline inside each search() alias
// so discovery + enrichment happens in a single GraphQL round-trip.
const PR_FRAGMENT = `
  number title createdAt updatedAt isDraft mergeStateStatus
  author { login }
  reviews(first: 50) { nodes { state author { login } submittedAt body } }
  reviewRequests(first: 10) { nodes { requestedReviewer { __typename ... on User { login } } } }
  comments(first: 50) { nodes { author { login } body createdAt } }
  reviewThreads(first: 50) { nodes { isResolved comments(last: 5) { nodes { author { login } body createdAt } } } }
  commits(last: 1) { nodes { commit { statusCheckRollup { state } committedDate } } }
  labels(first: 20) { nodes { name } }
`;

// GitHub label convention: the PR author applies this when they've
// assigned a Jira "QA Contact" (a reviewer with extra sign-off duties) on
// the linked ticket. There's no live Jira cross-reference in this
// standalone dashboard (see fetchLiveGitData — GitHub-only), so this
// label is the closest available signal without asking for a Jira token.
const TESTED_BY_ALL_LABEL = 'tested-by-all';

// Uses GitHub's "@me" search token (resolves to whoever the token belongs
// to) instead of interpolating a username — this is what lets the query be
// built with zero prior knowledge of who's using it. `viewer { login }`
// alongside the search aliases below is the one extra field that gets us
// the actual username string back, for all the client-side comparisons
// (author-highlighting, "only my comments", etc.) that still need it.
function buildLiveQuery() {
  const q = (extra) => `repo:${REPO} is:pr is:open ${extra}`;
  const alias = (name, searchQ) => `${name}: search(query: ${JSON.stringify(q(searchQ))}, type: ISSUE, first: 30) { nodes { ... on PullRequest { ${PR_FRAGMENT} } } }`;
  return `query {
    viewer { login name }
    ${alias('authored', 'author:@me')}
    ${alias('requested', 'user-review-requested:@me')}
    ${alias('stale', 'reviewed-by:@me -review:approved -author:@me')}
    ${alias('approved', 'review:approved reviewed-by:@me -author:@me')}
  }`;
}

function buildLivePrData(data, githubUser) {
  const prMap = {};
  const prStatus = {};

  const catNodes = {
    authored: (data.authored && data.authored.nodes) || [],
    requested: (data.requested && data.requested.nodes) || [],
    stale: (data.stale && data.stale.nodes) || [],
    approved: (data.approved && data.approved.nodes) || []
  };

  // "authored" is the only category that determines pr.author identity; the
  // other 3 searches just widen which PRs get pulled into the universe below
  // (a PR can match more than one — dedup happens via allNodesByNumber).
  // created/updated: keep full ISO datetime, do NOT truncate to a bare
  // YYYY-MM-DD date. A date-only string parses as UTC midnight (per the
  // ES spec), which can land on the wrong LOCAL calendar day entirely for
  // negative UTC offsets — e.g. "opened 3 hours ago" (evening UTC) sliced
  // to a date and reparsed can come out as "Yesterday" in formatRelativeAge.
  const labelsOf = node => (node.labels && node.labels.nodes || []).map(l => l.name);
  for (const node of catNodes.authored) {
    if (!(node.number in prMap)) {
      prMap[node.number] = { number: node.number, title: node.title, author: githubUser, updated: node.updatedAt || '', created: node.createdAt || '', comments: [], labels: labelsOf(node) };
    }
  }
  for (const node of [...catNodes.requested, ...catNodes.stale, ...catNodes.approved]) {
    if (!(node.number in prMap)) {
      prMap[node.number] = { number: node.number, title: node.title, author: node.author ? node.author.login : '', updated: node.updatedAt || '', created: node.createdAt || '', comments: [], labels: labelsOf(node) };
    }
  }

  // Dedup nodes across categories (a PR can match multiple searches) for enrichment
  const allNodesByNumber = {};
  for (const arr of Object.values(catNodes)) {
    for (const node of arr) {
      if (!(node.number in allNodesByNumber)) allNodesByNumber[node.number] = node;
    }
  }

  for (const node of Object.values(allNodesByNumber)) {
    const num = node.number;
    const prAuthorLogin = node.author ? node.author.login : '';

    const reviews = (node.reviews.nodes || []).map(r => ({ state: r.state, user: r.author ? r.author.login : '', submittedAt: r.submittedAt }));
    const requestedLogins = (node.reviewRequests.nodes || []).map(rr => rr.requestedReviewer && rr.requestedReviewer.login).filter(Boolean);
    const issueComments = (node.comments.nodes || []).map(c => ({ user: c.author ? c.author.login : '', body: (c.body || '').slice(0, 1500), when: c.createdAt }));

    const reviewers = simplifyReviewers(reviews, prAuthorLogin, requestedLogins);
    const filteredReviewers = reviewers.filter(r => !BOT_USERS.has(r.user));

    const lastCommit = node.commits && node.commits.nodes && node.commits.nodes[0] && node.commits.nodes[0].commit;
    const checksState = lastCommit && lastCommit.statusCheckRollup ? lastCommit.statusCheckRollup.state : null;

    prStatus[String(num)] = {
      reviewers: filteredReviewers,
      checks: mapChecksStatus(checksState),
      mergeable_state: (node.mergeStateStatus || '').toLowerCase(),
      draft: !!node.isDraft,
      // GitHub's GraphQL Commit type has no push-timestamp field (only
      // authoredDate/committedDate) — a push is a ref-update event, not
      // commit metadata, and isn't exposed here. This is the commit's own
      // timestamp, which can predate the actual push by any amount if
      // someone commits locally before pushing. Labeled "code changed:"
      // in the UI rather than "pushed" for that reason.
      lastCommitAt: (lastCommit && lastCommit.committedDate) || ''
    };

    // Merge comments: issue comments + all review-thread comments + non-empty review bodies
    let allComments = issueComments.slice();
    for (const thread of (node.reviewThreads.nodes || [])) {
      for (const c of (thread.comments.nodes || [])) {
        allComments.push({ user: c.author ? c.author.login : '', body: (c.body || '').slice(0, 1500), when: c.createdAt });
      }
    }
    for (const r of (node.reviews.nodes || [])) {
      if (r.body) {
        const rUser = r.author ? r.author.login : '';
        if (BOT_USERS.has(rUser)) continue;
        let prefix = '';
        if (r.state === 'CHANGES_REQUESTED') prefix = '[Changes Requested] ';
        else if (r.state === 'APPROVED') prefix = '[Approved] ';
        allComments.push({ user: rUser, body: prefix + (r.body || '').slice(0, 800), when: r.submittedAt || '' });
      }
    }
    allComments = allComments.filter(c => !BOT_USERS.has(c.user));
    allComments.sort((a, b) => (a.when || '').localeCompare(b.when || ''));
    allComments = allComments.slice(-30);

    if (num in prMap) {
      prMap[num].comments = allComments
        .map(c => ({ who: c.user, when: c.when, body: c.body }))
        .sort((a, b) => (b.when || '').localeCompare(a.when || ''));
    }
  }

  // No sort here — renderPRs() always re-sorts by PR number per section.
  const prsList = Object.values(prMap);

  return { prsList, prStatus };
}

// Single shared GraphQL POST + auth-error normalization — every GraphQL
// call in this file goes through this one function, so a 401 or a "bad
// credentials" error message always throws the same { authError: true }
// shape no matter which query triggered it, letting every catch block
// react identically (clear the token, prompt Settings). Previously
// duplicated verbatim in 2 places; a 3rd/4th caller (Closed PRs, Cycle
// Time) is exactly the kind of copy that was worth collapsing first.
async function graphqlRequest(token, query) {
  const resp = await fetch('https://api.github.com/graphql', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ query })
  });
  if (resp.status === 401) { const e = new Error('Unauthorized'); e.authError = true; throw e; }
  const json = await resp.json();
  if (json.errors && json.errors.length) {
    const msg = json.errors.map(e => e.message).join('; ');
    if (/bad credentials|unauthorized/i.test(msg)) { const e = new Error(msg); e.authError = true; throw e; }
    throw new Error(msg);
  }
  return json.data;
}

async function fetchLiveGitData(token) {
  const data = await graphqlRequest(token, buildLiveQuery());
  const githubUser = data.viewer.login;
  setMyGithubLogin(githubUser);
  setMyGithubName(data.viewer.name || '');
  return buildLivePrData(data, githubUser);
}

// Lightweight fragment for the Distribution chart — deliberately excludes
// comments/checks/etc. (not needed for a per-person PR count), unlike the
// full PR_FRAGMENT above. Runs against ALL open PRs in the repo (not
// scoped to @me) since the whole point is a team-wide view.
// __typename is requested on every actor field specifically so bot
// detection can use GitHub's own authoritative type system (see
// isBotActor() below) instead of relying solely on a hardcoded login
// list — confirmed live that e.g. red-hat-konflux and sourcery-ai are
// both __typename:"Bot" even though their logins don't look alike and
// neither has a "[bot]" suffix, which is exactly the kind of case a
// manually-maintained string list keeps missing.
// ==== SECTION: GRAPHQL — OPEN PR DISTRIBUTION (Distribution modal, Open tab) ====
const TEAM_PR_FRAGMENT = `
  number
  author { __typename login ... on User { name } }
  reviews(first: 50) { nodes { state author { __typename login ... on User { name } } } }
  reviewRequests(first: 20) { nodes { requestedReviewer { __typename ... on User { login name } ... on Bot { login } } } }
`;

function buildTeamDistributionQuery() {
  return `query {
    search(query: ${JSON.stringify(`repo:${REPO} is:pr is:open`)}, type: ISSUE, first: 100) {
      nodes { ... on PullRequest { ${TEAM_PR_FRAGMENT} } }
    }
  }`;
}

// Pure function (no DOM/fetch) so it's independently testable.
//
// Split into 3 buckets, not 2, specifically so every chart segment maps
// 1:1 onto a single GitHub search qualifier with NO approximation:
//   - reviewedCount: already submitted a review -> matches reviewed-by:X
//   - pendingCount:  requested, hasn't reviewed yet -> matches review-requested:X
//   - createdCount:  authored -> matches author:X
// These first two used to be merged into one "# Reviews" number (via
// simplifyReviewers' "reviewed OR still requested" union), which was
// impossible to link to accurately — GitHub can't OR those two qualifiers
// together (verified live), so every click had to guess one or the other
// and dead-end whenever that specific person's specific PRs were actually
// in the other bucket. Splitting them removes the guess entirely.
// Bot detection prefers GitHub's own __typename over the hardcoded
// BOT_USERS list — the list is kept only as a fallback for accounts that
// function like bots but for whatever reason aren't GraphQL-typed as one.
// Only used to filter REVIEW/REQUEST noise (CodeRabbit, Codecov, Sourcery
// automated commentary isn't meaningful "who's reviewing" data) — NOT
// applied to authorship. Bot-authored PRs (e.g. an automated dependency-
// bump bot) DO count in "# Created" and appear in the chart, since that
// volume is something the user explicitly wants visible.
function isBotActor(actor) {
  return !!actor && (actor.__typename === 'Bot' || BOT_USERS.has(actor.login));
}

function computeDistribution(prNodes) {
  const createdCount = {};
  const reviewedCount = {};
  const pendingCount = {};
  // Tracks every login ever seen with __typename:"Bot", regardless of
  // which bucket it ended up in — used by githubPrSearchUrl() to add the
  // "app/" prefix GitHub's search requires for GitHub-App-authored
  // content (confirmed live: "author:red-hat-konflux" finds nothing,
  // "author:app/red-hat-konflux" finds exactly its PRs). Bots without a
  // GraphQL Bot type (nothing seen so far, but BOT_USERS-listed ones are
  // possible in principle) won't get this prefix — GitHub's plain-login
  // form is what's needed for those instead.
  const botLogins = new Set();
  // login -> profile display name, for the chart's x-axis labels only —
  // GitHub's "name" field is optional and often unset, so this is sparse
  // by design; openDistributionModal() falls back to the login itself
  // wherever a person has no entry here. The login remains the one true
  // identity key everywhere else (counting, URL building) since it's
  // what GitHub search qualifiers require and names aren't guaranteed
  // unique anyway.
  const displayNames = {};
  const noteDisplayName = actor => {
    if (actor && actor.login && actor.name) displayNames[actor.login] = actor.name;
  };
  for (const node of prNodes) {
    const authorLogin = node.author ? node.author.login : '';
    if (node.author && node.author.__typename === 'Bot') botLogins.add(authorLogin);
    noteDisplayName(node.author);
    if (authorLogin) {
      createdCount[authorLogin] = (createdCount[authorLogin] || 0) + 1;
    }
    const reviews = (node.reviews.nodes || [])
      .filter(r => !isBotActor(r.author))
      .map(r => ({ state: r.state, user: r.author ? r.author.login : '' }));
    (node.reviews.nodes || []).forEach(r => noteDisplayName(r.author));
    // A PR's requested reviewer can be a whole GitHub Team (e.g.
    // "uhc-portal-senior-staff") rather than an individual — a repo
    // Action auto-assigns one specific team member as an individual
    // User-typed reviewer shortly after, so that person's own pending
    // count already reflects the assignment. The raw team-level request
    // itself is deliberately NOT counted here (confirmed live: 13 of 15
    // currently-open team-requested PRs already have that individual
    // assignment) — counting it too would double-count the same
    // work-item, and the couple of older PRs predating the Action just
    // stay uncounted rather than attributed to anyone.
    const requestedReviewers = (node.reviewRequests.nodes || [])
      .map(rr => rr.requestedReviewer)
      .filter(rev => rev && rev.__typename !== 'Team' && !isBotActor(rev));
    requestedReviewers.forEach(noteDisplayName);
    const requestedLogins = requestedReviewers.map(rev => rev.login).filter(Boolean);
    const reviewers = simplifyReviewers(reviews, authorLogin, requestedLogins);
    for (const r of reviewers) {
      const bucket = r.state === 'pending' ? pendingCount : reviewedCount;
      bucket[r.user] = (bucket[r.user] || 0) + 1;
    }
  }
  // "The team" isn't a hardcoded roster anywhere — it's derived from
  // whoever currently authored or is reviewing one of the repo's open
  // PRs, so this stays accurate with zero manual upkeep as people join,
  // leave, or their username changes.
  const roster = Array.from(new Set([...Object.keys(createdCount), ...Object.keys(reviewedCount), ...Object.keys(pendingCount)]));
  const totalFor = u => (reviewedCount[u] || 0) + (pendingCount[u] || 0) + (createdCount[u] || 0);
  roster.sort((a, b) => totalFor(b) - totalFor(a) || a.localeCompare(b));
  return {
    users: roster,
    isBot: roster.map(u => botLogins.has(u)),
    displayNames: roster.map(u => displayNames[u] || u),
    reviewedCounts: roster.map(u => reviewedCount[u] || 0),
    pendingCounts: roster.map(u => pendingCount[u] || 0),
    createdCounts: roster.map(u => createdCount[u] || 0)
  };
}

// Only called from openDistributionModal() on a button click — never on
// page load or auto-refresh. This is a heavier, repo-wide query (all open
// PRs, not just @me), so it's kept fully separate from the main live-fetch
// path and its cache.
async function fetchTeamDistribution(token) {
  const data = await graphqlRequest(token, buildTeamDistributionQuery());
  return computeDistribution((data.search && data.search.nodes) || []);
}

// ---- Closed PRs (last 3 months) — backs both the "Closed" and "Cycle
// Time" tabs off one shared fetch, since both just need mergedAt/closedAt
// per PR and there's no reason to hit GraphQL twice for the same window.
// ==== SECTION: GRAPHQL — CLOSED PRs & CYCLE TIME (Distribution modal, Closed/Cycle Time tabs) ====
const CLOSED_PRS_MONTHS = 6;
// Capped rather than fully paginated — a 6-month window on an active repo
// can run into the hundreds/thousands of closed PRs, and every extra page
// is a sequential network round-trip (GraphQL rate-limit cost itself is
// negligible — this fragment has no nested connections, ~1 point/page
// against a 5,000/hour budget; the real cost is wall-clock latency, not
// API quota). 600 (6 pages of 100) keeps pace with CLOSED_PRS_MONTHS so
// raising one without the other doesn't silently truncate the window.
const CLOSED_PRS_MAX = 600;

function threeMonthsAgoISODate() {
  const d = new Date();
  d.setMonth(d.getMonth() - CLOSED_PRS_MONTHS);
  return d.toISOString().slice(0, 10);
}

// Deliberately lighter than TEAM_PR_FRAGMENT — no reviews/reviewRequests,
// since Closed/Cycle-Time only need who authored each PR and when it was
// created vs. merged/closed.
const CLOSED_PR_FRAGMENT = `
  number
  author { __typename login ... on User { name } }
  createdAt
  mergedAt
  closedAt
`;

function buildClosedPRsQuery(sinceDate, afterCursor) {
  const after = afterCursor ? `, after: ${JSON.stringify(afterCursor)}` : '';
  const q = `repo:${REPO} is:pr is:closed closed:>=${sinceDate}`;
  return `query {
    search(query: ${JSON.stringify(q)}, type: ISSUE, first: 100${after}) {
      pageInfo { hasNextPage endCursor }
      nodes { ... on PullRequest { ${CLOSED_PR_FRAGMENT} } }
    }
  }`;
}

// onPageFetched(pageNum) is optional progress feedback — with
// CLOSED_PRS_MONTHS/MAX now covering up to 6 pages' worth of sequential
// round-trips, a static "Fetching…" spinner can sit still long enough to
// look stuck. Purely a UI nicety; omit it and this still works headless.
async function fetchClosedPRs(token, onPageFetched) {
  const sinceDate = threeMonthsAgoISODate();
  const nodes = [];
  let cursor = null;
  let page = 0;
  do {
    page++;
    const data = await graphqlRequest(token, buildClosedPRsQuery(sinceDate, cursor));
    const search = data.search || {};
    nodes.push(...(search.nodes || []));
    cursor = (search.pageInfo && search.pageInfo.hasNextPage) ? search.pageInfo.endCursor : null;
    if (onPageFetched) onPageFetched(page);
  } while (cursor && nodes.length < CLOSED_PRS_MAX);
  return { nodes: nodes.slice(0, CLOSED_PRS_MAX), sinceDate };
}

// Pure function (no DOM/fetch), same testability goal as computeDistribution.
// Splits each author's closed PRs into Merged vs. Closed-without-merging
// (abandoned/rejected) rather than a single "closed" count — a flat count
// can't distinguish "shipped a lot of work" from "a lot of PRs got
// abandoned," which is the more useful signal here.
//
// Also buckets every merged PR's days-to-merge (createdAt -> mergedAt) by
// the calendar month it was merged in, for the Cycle Time tab — a trend
// line (is the team's merge cadence speeding up or slowing down?) rather
// than a per-author bar, which told you who's slow but nothing about
// direction over time. Bucketed by merge month, not creation month,
// since a PR's duration data point only "completes" once it merges.
function computeClosedDistribution(prNodes) {
  const mergedCount = {};
  const abandonedCount = {};
  const monthlyDurations = {}; // "YYYY-MM" -> [daysToMerge, ...]
  const botLogins = new Set();
  const displayNames = {};
  const noteDisplayName = actor => {
    if (actor && actor.login && actor.name) displayNames[actor.login] = actor.name;
  };
  for (const node of prNodes) {
    const login = node.author ? node.author.login : '';
    if (!login) continue;
    if (node.author && node.author.__typename === 'Bot') botLogins.add(login);
    noteDisplayName(node.author);
    if (node.mergedAt) {
      mergedCount[login] = (mergedCount[login] || 0) + 1;
      const days = (new Date(node.mergedAt) - new Date(node.createdAt)) / 86400000;
      const monthKey = node.mergedAt.slice(0, 7); // "YYYY-MM"
      (monthlyDurations[monthKey] = monthlyDurations[monthKey] || []).push(days);
    } else {
      abandonedCount[login] = (abandonedCount[login] || 0) + 1;
    }
  }
  const roster = Array.from(new Set([...Object.keys(mergedCount), ...Object.keys(abandonedCount)]));
  const totalFor = u => (mergedCount[u] || 0) + (abandonedCount[u] || 0);
  roster.sort((a, b) => totalFor(b) - totalFor(a) || a.localeCompare(b));

  // Exclude the current (still in-progress) calendar month from the
  // Cycle Time trend — this does NOT affect the Closed tab's merged/
  // abandoned counts above, only the monthly-average line below. A
  // partial month's average reflects only however many PRs happened to
  // merge in the first few days of it, which is a small, still-shifting
  // sample that would otherwise misleadingly read as "this month's
  // cadence" and keep changing every time the chart is reopened.
  const currentMonthKey = new Date().toISOString().slice(0, 7);
  // Chronological "YYYY-MM" keys sort correctly as plain strings — no
  // Date parsing needed to order them.
  const cycleTimeMonths = Object.keys(monthlyDurations).filter(m => m !== currentMonthKey).sort();
  const cycleTimeMonthLabels = cycleTimeMonths.map(m => {
    const [y, mo] = m.split('-').map(Number);
    return new Date(y, mo - 1, 1).toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
  });
  const cycleTimeMonthlyAvgDays = cycleTimeMonths.map(m => {
    const arr = monthlyDurations[m];
    return Math.round((arr.reduce((sum, d) => sum + d, 0) / arr.length) * 10) / 10;
  });
  // Median alongside the mean — a straight arithmetic mean is dragged
  // hard by just a couple of PRs that sat open for weeks before finally
  // merging in a given month, even if most PRs that month were fast.
  // Median is outlier-resistant: if it stays flat while the mean swings,
  // that confirms the swing is a few stragglers, not an actual cadence
  // change. Plotted as a 2nd line precisely so the two shapes can be
  // compared at a glance.
  const median = arr => {
    const sorted = [...arr].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  };
  const cycleTimeMonthlyMedianDays = cycleTimeMonths.map(m => Math.round(median(monthlyDurations[m]) * 10) / 10);
  // PR volume per month — not plotted, but exposed so the UI can flag
  // low-volume months where an average is more noise than signal.
  const cycleTimeMonthlyCounts = cycleTimeMonths.map(m => monthlyDurations[m].length);
  // True overall average across every individual PR's duration in the
  // completed months above (weighted by actual PR count per month, not
  // an average-of-the-monthly-averages, which would under-weight busy
  // months and over-weight quiet ones) — drawn as a flat reference line.
  const allCompletedDurations = cycleTimeMonths.flatMap(m => monthlyDurations[m]);
  const cycleTimeOverallAvgDays = allCompletedDurations.length
    ? Math.round((allCompletedDurations.reduce((sum, d) => sum + d, 0) / allCompletedDurations.length) * 10) / 10
    : 0;

  return {
    users: roster,
    isBot: roster.map(u => botLogins.has(u)),
    displayNames: roster.map(u => displayNames[u] || u),
    mergedCounts: roster.map(u => mergedCount[u] || 0),
    abandonedCounts: roster.map(u => abandonedCount[u] || 0),
    cycleTimeMonths,
    cycleTimeMonthLabels,
    cycleTimeMonthlyAvgDays,
    cycleTimeMonthlyMedianDays,
    cycleTimeMonthlyCounts,
    cycleTimeOverallAvgDays
  };
}

// ==== SECTION: MY PRs TAB — UI SHELL (Refresh button, empty state, tab content) ====
function renderGitLiveControls() {
  const cached = getGitLiveCache();
  const initialStatus = cached && cached.fetchedAt
    ? `Last fetched: ${new Date(cached.fetchedAt).toLocaleString()} (cached)`
    : 'Not yet fetched — click Refresh';
  return `<div id="git-live-controls" style="margin:8px 0 4px 0;">
    <button id="git-live-refresh-btn" class="git-live-btn">🔄 Refresh</button>
    <span id="git-live-status" style="margin-left:4px;font-size:12px;color:#6b7280;">${initialStatus}</span>
  </div>`;
}

function renderGitEmptyState() {
  return `<div style="color:#6b7280;padding:24px 4px;">
    <p>No live GitHub data loaded yet — this tab is fetched directly from the GitHub API.</p>
    <p style="font-size:12px;margin-top:6px;">Click <strong style="color:#a5b4fc;">"🔄 Refresh"</strong> above to load your PRs.</p>
  </div>`;
}

// Entry point for the page's content — hydrates from the localStorage
// cache of the last live fetch if present, otherwise shows an empty state.
function renderGitTabContent() {
  const cached = getGitLiveCache();
  if (cached) {
    D.prs = cached.prsList;
    D.pr_status = cached.prStatus;
    return renderPRs();
  }
  return renderGitEmptyState();
}

async function handleGitLiveRefresh() {
  const statusEl = document.getElementById('git-live-status');
  const token = getGithubToken();
  if (!token) {
    openSettingsModal('Enter a GitHub token above, then Save to fetch PRs.');
    return;
  }
  statusEl.textContent = 'Fetching live data…';
  statusEl.style.color = '#f59e0b';
  try {
    const { prsList, prStatus } = await fetchLiveGitData(token);
    D.prs = prsList;
    D.pr_status = prStatus;
    setGitLiveCache(prsList, prStatus);
    document.getElementById('git-live-content').innerHTML = renderPRs();
    initInteractions(document.getElementById('git-live-content'));
    statusEl.textContent = `Last refreshed at ${new Date().toLocaleTimeString()}`;
    statusEl.style.color = '#22c55e';
  } catch (err) {
    if (err && err.authError) {
      clearGithubToken();
      statusEl.textContent = 'Token invalid/expired — click the ⚙ Settings icon to re-enter it.';
    } else {
      statusEl.textContent = 'Error: ' + (err && err.message ? err.message : 'fetch failed');
    }
    statusEl.style.color = '#ef4444';
    console.error('[git-live] fetch failed', err);
  }
}

let distributionChartInstance = null;
// Which tab is currently showing — drives nothing on its own, just read

};

function ensureDistributionModal() {
  if (document.getElementById('distribution-overlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'distribution-overlay';
  overlay.innerHTML = `<div id="distribution-modal">
    <button id="distribution-close" title="Close">✕</button>
    <div id="distribution-tabs">
      <button class="distribution-tab active" data-tab="open">Open</button>
      <button class="distribution-tab" data-tab="closed">Closed</button>
      <button class="distribution-tab" data-tab="cycletime">Cycle Time</button>
    </div>
    <h2 id="distribution-title">PR Distribution by Contributors</h2>
    <div id="distribution-subtitle"></div>
    <div id="distribution-status"><div id="distribution-spinner"></div>Loading…</div>
    <div id="distribution-chart-wrap"><canvas id="distribution-canvas" height="90"></canvas></div>
    <div id="distribution-footnote"></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeDistributionModal(); });
  document.getElementById('distribution-close').addEventListener('click', closeDistributionModal);
  overlay.querySelectorAll('.distribution-tab').forEach(btn => {

    if (e.key === 'Escape' && overlay.classList.contains('open')) closeDistributionModal();

function closeDistributionModal() {
  const overlay = document.getElementById('distribution-overlay');
