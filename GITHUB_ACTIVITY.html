// ---- Shared status/chart plumbing used by all 3 tabs ----

function distributionShowStatus(message, color) {
  document.getElementById('distribution-chart-wrap').style.display = 'none';
  document.getElementById('distribution-footnote').style.display = 'none';
  const statusEl = document.getElementById('distribution-status');
  statusEl.style.display = 'block';
  statusEl.style.color = color || '#6b7280';
  statusEl.textContent = message;
}

function distributionShowSpinner(message) {
  document.getElementById('distribution-chart-wrap').style.display = 'none';
  document.getElementById('distribution-footnote').style.display = 'none';
  const statusEl = document.getElementById('distribution-status');
  statusEl.style.display = 'block';
  statusEl.style.color = '#6b7280';
  // innerHTML (not textContent) here since the spinner div needs to
  // survive — status/empty/error states above and below all use plain
  // textContent since those are terminal states with no spinner.
  statusEl.innerHTML = `<div id="distribution-spinner"></div>${esc(message)}`;
}

function distributionShowError(err) {
  if (err && err.authError) {
    clearGithubToken();
    distributionShowStatus('Token invalid/expired — close this and click the ⚙ Settings icon to re-enter it.', '#ef4444');
  } else {
    distributionShowStatus('Error: ' + (err && err.message ? err.message : 'fetch failed'), '#ef4444');
  }
  console.error('[distribution] fetch failed', err);
}

// Destroys the previous Chart.js instance and draws a fresh one from the
// given config, then reveals the chart + footnote (hiding the status
// text/spinner). Shared by all 3 tabs so a tab switch can never leave a
// stale canvas drawn underneath the new one.
function distributionRenderChart(config) {
  document.getElementById('distribution-status').style.display = 'none';
  document.getElementById('distribution-chart-wrap').style.display = 'block';
  document.getElementById('distribution-footnote').style.display = 'block';
  const canvas = document.getElementById('distribution-canvas');
  if (distributionChartInstance) distributionChartInstance.destroy();
  distributionChartInstance = new Chart(canvas.getContext('2d'), config);
}

// Axis/legend/grid/datalabel styling shared across all 3 tabs — only the
// datasets, title, and click-qualifier logic differ per tab.
function distributionBaseChartOptions(yAxisTitle, onBarClick) {
  return {
    responsive: true,
    // Fixed pixel height (via the wrapper's CSS height, not an aspect
    // ratio) so small-count segments get enough real room for their
    // number + underline — see #distribution-chart-wrap in <style>.
    maintainAspectRatio: false,
    onClick: (evt, elements) => { if (elements.length) onBarClick(elements[0]); },
    onHover: (evt, elements) => {
      evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
    },
    scales: {
      x: { stacked: true, ticks: { color: '#d1d5db' }, grid: { color: '#262b36' } },
      y: { stacked: true, beginAtZero: true, ticks: { color: '#d1d5db', precision: 0 }, grid: { color: '#262b36' }, title: { display: true, text: yAxisTitle, color: '#9ca3af' } }
    },
    plugins: {
      legend: { labels: { color: '#d1d5db' } },
      tooltip: { enabled: false },
      // chartjs-plugin-datalabels (loaded in <head>) — show each segment's
      // raw count/value, hide the label on empty/zero segments since a
      // zero-height segment has no room to render text anyway.
      datalabels: { color: '#0a0a0a', font: { weight: 'bold' }, formatter: v => (v > 0 ? v : '') }
    }
  };
}

// ---- Open tab ----

function renderOpenDistributionChart(data) {
  const { users, isBot, displayNames, reviewedCounts, pendingCounts, createdCounts } = data;
  if (!users.length) {
    distributionShowStatus('No open PRs found in ' + REPO + '.');
    return;
  }
  // Index-aligned with the datasets array below — one source of truth
  // for "which segment maps to which GitHub search qualifier" so the
  // click handler can never drift out of sync with the dataset order.
  const DATASET_QUALIFIERS = ['reviewed-by', 'review-requested', 'author'];
  // x-axis text only — marks bots (e.g. "red-hat-konflux 🤖") so their
  // automated PR volume reads distinctly from human team members. `users`
  // itself (used for URL-building) stays as the plain login throughout.
  const displayLabels = users.map((u, i) => isBot[i] ? `${displayNames[i]} 🤖` : displayNames[i]);
  distributionRenderChart({
    type: 'bar',
    data: {
      labels: displayLabels,
      datasets: [
        { label: '# Reviewed', data: reviewedCounts, backgroundColor: '#60a5fa', categoryPercentage: 0.9, barPercentage: 0.95 },
        { label: '# Pending Review', data: pendingCounts, backgroundColor: '#f59e0b', categoryPercentage: 0.9, barPercentage: 0.95 },
        { label: '# Created', data: createdCounts, backgroundColor: '#2dd4bf', categoryPercentage: 0.9, barPercentage: 0.95 }
      ]
    },
    // Clicking a segment opens that person's matching GitHub PR search in
    // a new tab — an EXACT match, not an approximation, since each
    // segment's count was computed from exactly one qualifier.
    options: distributionBaseChartOptions('# PRs', el => {
      const { datasetIndex, index } = el;
      window.open(githubPrSearchUrl(DATASET_QUALIFIERS[datasetIndex], users[index], isBot[index]), '_blank');
    })
  });
}

// ---- Closed tab ----

function renderClosedDistributionChart(data) {
  const { users, isBot, displayNames, mergedCounts, abandonedCounts, sinceDate } = data;
  if (!users.length) {
    distributionShowStatus(`No closed PRs found in ${REPO} in the last ${CLOSED_PRS_MONTHS} months.`);
    return;
  }
  const displayLabels = users.map((u, i) => isBot[i] ? `${displayNames[i]} 🤖` : displayNames[i]);
  distributionRenderChart({
    type: 'bar',
    data: {
      labels: displayLabels,
      datasets: [
        { label: 'Merged', data: mergedCounts, backgroundColor: '#4ade80', categoryPercentage: 0.9, barPercentage: 0.95 },
        { label: 'Closed without merging', data: abandonedCounts, backgroundColor: '#f87171', categoryPercentage: 0.9, barPercentage: 0.95 }
      ]
    },
    options: distributionBaseChartOptions('# PRs', el => {
      const { datasetIndex, index } = el;
      const base = datasetIndex === 0
        ? `is:pr is:merged closed:>=${sinceDate}`
        : `is:pr is:closed is:unmerged closed:>=${sinceDate}`;
      window.open(githubPrSearchUrl('author', users[index], isBot[index], base), '_blank');
    })
  });
}

// ---- Cycle Time tab ----
// A line chart, not a per-author bar — the useful question here is "is
// the team's merge cadence getting faster or slower over time," which a
// per-person bar can't show at all (it ranks people, not trend direction).

function renderCycleTimeChart(data) {
  const { cycleTimeMonths, cycleTimeMonthLabels, cycleTimeMonthlyAvgDays, cycleTimeMonthlyMedianDays, cycleTimeMonthlyCounts, cycleTimeOverallAvgDays } = data;
  if (!cycleTimeMonths.length) {
    distributionShowStatus(`No merged PRs found in ${REPO} in the last ${CLOSED_PRS_MONTHS} months (excluding the current, still in-progress month).`);
    return;
  }
  // Dynamic y-axis floor, not a hardcoded one — median can legitimately
  // sit well below the mean (a right-skewed "mostly fast, a few very
  // slow" distribution), so a fixed floor picked to suit the mean alone
  // would silently clip the median line off the bottom of the chart.
  const yMin = Math.max(0, Math.floor(Math.min(...cycleTimeMonthlyAvgDays, ...cycleTimeMonthlyMedianDays)) - 1);
  distributionRenderChart({
    type: 'line',
    data: {
      labels: cycleTimeMonthLabels,
      datasets: [
        {
          label: 'Avg days to merge',
          data: cycleTimeMonthlyAvgDays,
          borderColor: '#a5b4fc',
          // Explicit (not relying on Chart.js's global line-element
          // default) so the legend override below can mirror this exact
          // value — see generateLabels in plugins.legend.
          borderWidth: 3,
          backgroundColor: 'rgba(165, 180, 252, 0.15)',
          pointBackgroundColor: '#a5b4fc',
          pointRadius: 5,
          pointHoverRadius: 7,
          tension: 0.25,
          fill: true
        },
        // Median per month — no per-point labels (would collide with the
        // mean line's labels above); the point is to compare this line's
        // SHAPE against the mean line's, not read exact values off it.
        {
          label: 'Median days to merge',
          data: cycleTimeMonthlyMedianDays,
          borderColor: '#34d399',
          borderWidth: 3,
          backgroundColor: 'transparent',
          pointBackgroundColor: '#34d399',
          pointRadius: 4,
          pointHoverRadius: 6,
          tension: 0.25,
          fill: false,
          datalabels: { display: false }
        },
        // Flat reference line at the overall average — a 2nd dataset with
        // the same value repeated across every x-point, styled dashed
        // with no markers, rather than pulling in a 5th CDN dependency
        // (chartjs-plugin-annotation) just to draw one line.
        {
          label: `${cycleTimeMonths.length}-month avg (${cycleTimeOverallAvgDays}d)`,
          data: cycleTimeMonthLabels.map(() => cycleTimeOverallAvgDays),
          borderColor: '#6b7280',
          borderDash: [6, 6],
          borderWidth: 1.5,
          pointRadius: 0,
          pointHoverRadius: 0,
          tension: 0,
          fill: false,
          // Per-dataset override (chartjs-plugin-datalabels respects
          // this) — the per-point "Nd (n=X)" labels below only make
          // sense on the real monthly-average line, not this flat one.
          datalabels: { display: false }
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      // Extra right padding so the last month's datalabel (often the
      // widest text in the chart) has room to render without being cut
      // off at the canvas edge — paired with the per-point align
      // override below, which also shifts that specific label leftward
      // off its point instead of centering it.
      layout: { padding: { top: 20, right: 50 } },
      // Clicking a month point opens that month's merged PRs on GitHub —
      // no author qualifier here (this chart isn't per-person), just a
      // merged:<month-start>..<month-end> date-range search.
      onClick: (evt, elements) => {
        if (!elements.length) return;
        const { index } = elements[0];
        const [y, mo] = cycleTimeMonths[index].split('-').map(Number);
        const monthStart = new Date(y, mo - 1, 1).toISOString().slice(0, 10);
        const monthEnd = new Date(y, mo, 0).toISOString().slice(0, 10);
        // sort:created-asc — within a merged-this-month result set, the
        // oldest-created PRs are exactly the long-tail stragglers that
        // skew the mean (they sat open the longest before finally
        // landing). Oldest-first means the useful ones are at the top of
        // the results instead of buried behind a page of fast merges.
        const url = `https://github.com/${REPO}/pulls?q=${encodeURIComponent(`is:pr is:merged merged:${monthStart}..${monthEnd} sort:created-asc`)}`;
        window.open(url, '_blank');
      },
      onHover: (evt, elements) => {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      scales: {
        x: { ticks: { color: '#d1d5db' }, grid: { color: '#262b36' } },
        // Dynamic floor (not beginAtZero) — days-to-merge realistically
        // never approaches 0 for this team, so a 0-floor wastes vertical
        // space. yMin is computed from the actual mean+median data above
        // specifically so it never clips either line.
        y: { min: yMin, ticks: { color: '#d1d5db' }, grid: { color: '#262b36' }, title: { display: true, text: 'Avg days open → merged', color: '#9ca3af' } }
      },
      plugins: {
        legend: {
          labels: {
            color: '#d1d5db',
            usePointStyle: true,
            // Both datasets here are lines, not filled boxes — the
            // default legend swatch is a rectangle, which read as "where's
            // the box in the chart?" since this chart has no bars. Custom
            // generateLabels wraps Chart.js's own default (so text/color/
            // etc. all still come from the dataset as normal) and only
            // overrides pointStyle to a line/dash glyph matching each
            // dataset's actual line style. Deliberately NOT setting
            // pointStyle on the datasets themselves — that would also
            // change the real circular markers drawn on the chart.
            generateLabels: chart => {
              const items = Chart.defaults.plugins.legend.labels.generateLabels(chart);
              items.forEach(item => {
                const ds = chart.data.datasets[item.datasetIndex];
                item.pointStyle = (ds.borderDash && ds.borderDash.length) ? 'dash' : 'line';
                // Mirror each dataset's own borderWidth into the legend
                // glyph explicitly — Chart.js's point-style legend icons
                // don't reliably come out visually matching the actual
                // plotted line's thickness otherwise.
                item.lineWidth = ds.borderWidth;
              });
              return items;
            }
          }
        },
        tooltip: { enabled: false },
        // Shows "<avg>d" above each point plus the underlying PR count
        // for that month (small-sample months read very differently than
        // a 20-PR month averaging the same number of days).
        datalabels: {
          // The last point's label is the one most likely to overflow
          // the canvas's right edge (nothing to its right to balance a
          // centered label against) — shift it to sit left of its point
          // instead of centered above it. Every other point keeps the
          // normal centered-above placement.
          align: ctx => ctx.dataIndex === cycleTimeMonthLabels.length - 1 ? 'left' : 'top',
          offset: ctx => ctx.dataIndex === cycleTimeMonthLabels.length - 1 ? 12 : 8,
          color: '#d1d5db',
          font: { weight: 'bold', size: 11 },
          formatter: (v, ctx) => `${v}d (# PRs merged: ${cycleTimeMonthlyCounts[ctx.dataIndex]})`
        }
      }
    }
  });
}

// ---- Tab orchestration ----

async function loadDistributionTab(tab) {
  distributionActiveTab = tab;
  document.getElementById('distribution-footnote').textContent = DISTRIBUTION_FOOTNOTES[tab];
  const subtitleEl = document.getElementById('distribution-subtitle');
  const subtitleText = DISTRIBUTION_SUBTITLES[tab] || '';
  subtitleEl.textContent = subtitleText;
  subtitleEl.classList.toggle('visible', !!subtitleText);

  const token = getGithubToken();
  if (!token) {
    closeDistributionModal();
    openSettingsModal('Enter a GitHub token above, then Save and click Distribution again.');
    return;
  }

  if (tab === 'open') {
    document.getElementById('distribution-title').textContent = `Open PR Distribution by ${REPO} Contributors`;
    distributionShowSpinner('Fetching team PR data…');
    try {
      if (!distributionCache.open) distributionCache.open = await fetchTeamDistribution(token);
      renderOpenDistributionChart(distributionCache.open);
    } catch (err) {
      distributionShowError(err);
    }
    return;
  }

  // "closed" and "cycletime" share one fetch — both just need each closed
  // PR's author + createdAt/mergedAt, so there's no reason to hit GraphQL
  // twice for the same 3-month window.
  document.getElementById('distribution-title').textContent = tab === 'closed'
    ? `Closed PR Distribution by ${REPO} Contributors (last ${CLOSED_PRS_MONTHS} months)`
    : `PR Cycle Time for ${REPO} by Month (last ${CLOSED_PRS_MONTHS} months)`;
  distributionShowSpinner('Fetching closed PR data…');
  try {
    if (!distributionCache.closed) {
      const { nodes, sinceDate } = await fetchClosedPRs(token, page => {
        distributionShowSpinner(`Fetching closed PR data… (page ${page})`);
      });
      distributionCache.closed = { ...computeClosedDistribution(nodes), sinceDate };
    }
    if (tab === 'closed') renderClosedDistributionChart(distributionCache.closed);
    else renderCycleTimeChart(distributionCache.closed);
  } catch (err) {
    distributionShowError(err);
  }
}

// Opens the modal and loads a fresh "Open" tab snapshot — an on-demand,
// point-in-time fetch for the modal only. Deliberately not persisted to
// the main live-fetch cache (which stays scoped to @me) and never
// triggered by page load or auto-refresh — only this click handler (and
// subsequent tab clicks) ever hit these team-wide queries.
async function openDistributionModal() {
  ensureDistributionModal();
  const overlay = document.getElementById('distribution-overlay');
  overlay.classList.add('open');
  distributionCache = { open: null, closed: null };
  overlay.querySelectorAll('.distribution-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === 'open'));
  await loadDistributionTab('open');
}

// ==== SECTION: PAGE SHELL (header, changelog popover, top-level render) ====
function renderChangelogPopover() {
  const entries = Object.keys(CHANGELOG).map(v =>
    `<div class="changelog-entry"><div class="changelog-version">v${esc(v)}</div><div class="changelog-desc">${esc(CHANGELOG[v])}</div></div>`
  ).join('');
  return `<div id="changelog-popover">${entries}</div>`;
}

function toggleChangelogPopover(e) {
  e.stopPropagation();
  document.getElementById('changelog-popover').classList.toggle('open');
}

function closeChangelogPopover() {
  const popover = document.getElementById('changelog-popover');
  if (popover) popover.classList.remove('open');
}

function renderPage() {
  const myUser = getMyGithubLogin();
  // Full profile name when GitHub has one on file for this token's owner,
  // falling back to "@login" otherwise — same fallback rule as the
  // Distribution chart's displayNames (see computeDistribution).
  const myName = getMyGithubName();
  const myDisplay = myName ? esc(myName) : (myUser ? `@${esc(myUser)}` : '');
  const titleText = 'A Better Git Dashboard' + (myDisplay ? ` for <span style="color:${MY_NAME_COLOR};">${myDisplay}</span>` : '');
  let html = `<h1 style="display:flex;align-items:baseline;justify-content:space-between;position:relative;">`
    + `<span>${titleText}</span>`
    + `<span style="position:relative;font-size:0.5em;font-weight:normal;">`
    + `<span id="version-badge" style="color:#6b7280;" title="Click for changelog">v${esc(APP_VERSION)}</span>`
    + ` <span id="token-gear-btn" style="cursor:pointer;" title="Settings (repo &amp; GitHub token)">⚙️</span>`
    + renderChangelogPopover()
    + `</span>`
    + `</h1>`;
  html += renderGitLiveControls();
  html += `<div id="git-live-content">`;
  html += renderGitTabContent();
  html += `</div>`;

  document.getElementById('app').innerHTML = html;
  pruneLocalStorage();
  initInteractions();
}

function pruneLocalStorage() {
  // Prune unread-comment bookmarks for PRs no longer in the data (closed/merged)
  const prNumKeys = new Set((D.prs || []).map(p => String(p.number)));
  const seenMap = getCommentsSeenMap();
  let seenChanged = false;
  for (const k of Object.keys(seenMap)) {
    if (!prNumKeys.has(k)) { delete seenMap[k]; seenChanged = true; }
  }
  if (seenChanged) localStorage.setItem(COMMENTS_SEEN_KEY, JSON.stringify(seenMap));
}

// ==== SECTION: DOM EVENT BINDING (click/keydown handlers for the whole page) ====
function initInteractions(root) {
  root = root || document;

  // Version badge / changelog popover — bind once, same reasoning as the
  // git-live-controls buttons below (the <h1> is only rendered once).
  const versionBadge = document.getElementById('version-badge');
  if (versionBadge && !versionBadge.dataset.bound) {
    versionBadge.dataset.bound = '1';
    versionBadge.addEventListener('click', toggleChangelogPopover);
    document.addEventListener('click', closeChangelogPopover);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChangelogPopover(); });
  }

  // Git live-fetch controls — bind once; these elements are never
  // recreated on a live refresh (only #git-live-content is replaced).
  const gitRefreshBtn = document.getElementById('git-live-refresh-btn');
  if (gitRefreshBtn && !gitRefreshBtn.dataset.bound) {
    gitRefreshBtn.dataset.bound = '1';
    gitRefreshBtn.addEventListener('click', handleGitLiveRefresh);
  }
  // Gear icon next to the version badge — opens the Settings modal (repo +
  // token). Bound once like version-badge above (the <h1> is only
  // rendered once).
  const tokenGearBtn = document.getElementById('token-gear-btn');
  if (tokenGearBtn && !tokenGearBtn.dataset.bound) {
    tokenGearBtn.dataset.bound = '1';
    tokenGearBtn.addEventListener('click', e => {
      e.stopPropagation();
      openSettingsModal();
    });
  }

  // Distribution chart button — part of renderPRs()'s output, so it's a
  // fresh node on every render (initial load and every live refresh);
  // no dataset.bound guard needed, same as the other root-scoped bindings
  // below (unlike the git-live-controls buttons above, which persist
  // across refreshes and do need one).
  root.querySelectorAll('#pr-distribution-btn').forEach(btn => {
    btn.addEventListener('click', openDistributionModal);
  });

  // "Only my comments" filter checkboxes (per section, applies to all PRs in table)
  root.querySelectorAll('.my-comments-filter').forEach(cb => {
    cb.addEventListener('change', () => {
      const tableId = cb.getAttribute('data-table');
      const table = document.getElementById(tableId);
      if (!table) return;
      const myUser = getMyGithubLogin();
      const filtered = cb.checked;
      // Process each PR's comment table
      table.querySelectorAll('tr.pr-comments').forEach(commentRow => {
        const innerTable = commentRow.querySelector('table[id]');
        if (!innerTable) return;
        const rows = innerTable.querySelectorAll('tr[data-comment-user]');
        let anyVisible = false;
        let myCount = 0;
        rows.forEach(r => {
          const isPageHidden = r.hasAttribute('data-page-hidden');
          const isMine = r.getAttribute('data-comment-user') === myUser;
          if (isMine) myCount++;
          if (filtered) {
            r.style.display = isMine ? '' : 'none';
            if (isMine) anyVisible = true;
          } else {
            r.style.display = isPageHidden ? 'none' : '';
            if (!isPageHidden) anyVisible = true;
          }
        });
        // The "show date once per day" grouping (see renderPRTable) was
        // computed assuming every row is visible in sequence. Filtering can
        // hide the specific row that was carrying a date's visible stamp
        // while leaving a same-day row below it on screen with a blank
        // date cell — recompute the grouping across only the rows that
        // ended up actually visible. Rows are already in newest-first DOM
        // order (never reordered), so the first visible row is also always
        // the "latest comment" for the summary label below — when filtered
        // to "Only my comments" this naturally becomes the latest comment
        // *from me*, with no separate code path needed.
        let lastDate = '';
        let latestWho = '', latestWhen = '';
        rows.forEach(r => {
          if (r.style.display === 'none') return;
          if (!latestWho) { latestWho = r.getAttribute('data-comment-user'); latestWhen = r.getAttribute('data-when'); }
          const dateCell = r.querySelector('.comment-date-cell');
          const rowDate = r.getAttribute('data-date') || '';
          dateCell.textContent = rowDate !== lastDate ? rowDate : '';
          lastDate = rowDate;
        });
        const countLabel = commentRow.querySelector('.comments-count-label');
        if (countLabel) {
          const total = parseInt(countLabel.getAttribute('data-total'), 10) || 0;
          countLabel.textContent = formatCommentsSummary(filtered ? myCount : total, total, latestWho, latestWhen);
        }
        // Show/hide "no comments" message
        let noMsg = innerTable.parentElement.querySelector('.no-my-comments');
        if (filtered && !anyVisible) {
          if (!noMsg) {
            noMsg = document.createElement('div');
            noMsg.className = 'no-my-comments';
            noMsg.style.cssText = 'color:#6b7280;font-size:11px;font-style:italic;padding:4px 0;';
            noMsg.textContent = 'No comments from you on this PR.';
            innerTable.parentElement.insertBefore(noMsg, innerTable.nextSibling);
          }
          noMsg.style.display = '';
        } else if (noMsg) {
          noMsg.style.display = 'none';
        }
        // Hide/show load more button when filtered
        const loadBtn = innerTable.parentElement.querySelector('.load-more-comments');
        if (loadBtn) loadBtn.style.display = filtered ? 'none' : '';
      });
    });
  });

  // Load more comments pagination
  root.querySelectorAll('.load-more-comments').forEach(btn => {
    btn.addEventListener('click', () => {
      const table = document.getElementById(btn.getAttribute('data-target'));
      if (!table) return;
      const pageSize = parseInt(btn.getAttribute('data-page-size'));
      const hiddenRows = Array.from(table.querySelectorAll('tr[data-page-hidden="1"]'));
      const toShow = hiddenRows.slice(0, pageSize);
      toShow.forEach(r => { r.style.display = ''; r.removeAttribute('data-page-hidden'); });
      const remaining = hiddenRows.length - toShow.length;
      if (remaining > 0) {
        btn.textContent = `Load more (${remaining} remaining)`;
      } else {
        btn.remove();
      }
    });
  });

  // Unread comment tracking — mark seen (and drop the badge) when a PR's
  // comment thread is expanded, either individually or via bulk Expand.
  root.querySelectorAll('details[data-pr-comments]').forEach(details => {
    if (details.dataset.unreadBound) return;
    details.dataset.unreadBound = '1';
    details.addEventListener('toggle', () => {
      if (!details.open) return;
      const prNum = details.getAttribute('data-pr-comments');
      const pr = (D.prs || []).find(p => String(p.number) === prNum);
      if (!pr || !pr.comments || !pr.comments.length) return;
      const maxWhen = pr.comments.reduce((max, c) => (c.when || '') > max ? (c.when || '') : max, '');
      markCommentsSeen(prNum, maxWhen);
      const badge = details.querySelector('.unread-badge');
      if (badge) badge.remove();
      // Keep the header's aggregate badge in sync — this handler only
      // touches one row's own badge above, so without this the header
      // total would stay stale until the next full renderPRs() call.
      refreshUnreadTotalBadge();
    });
  });

  // PR comments expand/collapse buttons — toggles <details> open state
  root.querySelectorAll('.pr-comments-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const tableId = btn.getAttribute('data-table');
      const table = document.getElementById(tableId);
      if (!table) return;
      const details = table.querySelectorAll('tr.pr-comments details');
      const anyOpen = Array.from(details).some(d => d.open);
      details.forEach(d => d.open = !anyOpen);
      btn.textContent = anyOpen ? 'Expand All Comments' : 'Collapse All Comments';
    });
  });

  // Draft PRs show/hide button — toggles the .hide-drafts class on the
  // table (see CSS) rather than swapping in a second physical table, so
  // draft rows stay sorted consistently with everything else.
  root.querySelectorAll('.draft-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const tableId = btn.getAttribute('data-draft-table');
      const table = document.getElementById(tableId);
      if (!table) return;
      const nowHidden = table.classList.toggle('hide-drafts');
      btn.textContent = btn.textContent.replace(nowHidden ? 'Hide' : 'Show', nowHidden ? 'Show' : 'Hide');
    });
  });

  // Focus Mode — toggles the .focus-mode class on the table (see CSS),
  // hiding every row except PRs I authored or am currently waiting to
  // review. Same class-toggle-on-table approach as draft-toggle above.
  root.querySelectorAll('.focus-mode-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const tableId = btn.getAttribute('data-table');
      const table = document.getElementById(tableId);
      if (!table) return;
      const active = table.classList.toggle('focus-mode');
      btn.classList.toggle('active', active);
      // "Exit Focus Mode" (not "Show All PRs") — the broadened view is
      // still just My PRs (authored or reviewing), never literally every
      // open PR in the repo, so the label shouldn't claim otherwise.
      btn.textContent = active ? 'Exit Focus Mode' : 'Focus Mode';
      // Tooltip explains what clicking Focus Mode WOULD show — irrelevant
      // once already in that state, so it's removed (not just emptied;
      // the CSS tooltip is driven by the [data-tooltip] attribute's mere
      // presence) while active, and restored when toggled back off.
      if (active) btn.removeAttribute('data-tooltip');
      else btn.setAttribute('data-tooltip', FOCUS_MODE_TOOLTIP);
    });
  });

  // Table sorting. :scope > thead th restricts this to each table's own
  // header row — markdown tables rendered inside comment bodies (via
  // marked.js) are nested <table> elements with their own <thead>, which
  // this scoping excludes (their <th> lack .sort-indicator/.no-sort anyway
  // and must never be wired to sortTable()).
  root.querySelectorAll('table').forEach(table => {
    const state = { col: -1, asc: true };
    table.querySelectorAll(':scope > thead th').forEach((th, idx) => {
      if (!th.querySelector('.sort-indicator')) return;
      th.addEventListener('click', e => {
        if (e.target.classList.contains('resize-handle')) return;
        if (th.classList.contains('no-sort')) return;
        if (state.col === idx) state.asc = !state.asc;
        else { state.col = idx; state.asc = true; }
        sortTable(table, idx, state.asc);
      });
    });
  });

  // Resizable columns
  root.querySelectorAll('.resize-handle').forEach(handle => {
    handle.addEventListener('mousedown', e => {
      const th = handle.parentElement;
      const startX = e.pageX, startWidth = th.offsetWidth;
      handle.classList.add('active');
      const onMove = ev => { th.style.width = (startWidth + ev.pageX - startX) + 'px'; th.style.minWidth = th.style.width; };
      const onUp = () => { handle.classList.remove('active'); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
  });

}

// ==== SECTION: TABLE SORTING ====
function sortTable(table, colIdx, asc) {
  // :scope > thead th restricts the match to this table's own header row.
  // Plain 'th' matches ANY descendant <th>, including header cells inside
  // GitHub-Flavored-Markdown tables that marked.js renders inside PR comment
  // bodies — those have no .sort-indicator span, so touching them here threw
  // "Cannot set properties of null" the moment any comment contained a
  // markdown table. Same class of bug as the tbody row-scoping fix below.
  const headers = table.querySelectorAll(':scope > thead th');
  // Skip no-sort headers (Reviewers/Checks) — otherwise every sort click
  // clobbers their intentionally-blank indicator back to a visible '⇅'.
  headers.forEach(h => {
    if (h.classList.contains('no-sort')) return;
    h.classList.remove('sorted');
    h.querySelector('.sort-indicator').textContent = '⇅';
  });
  headers[colIdx].classList.add('sorted');
  headers[colIdx].querySelector('.sort-indicator').textContent = asc ? '▲' : '▼';
  const tbody = table.querySelector('tbody');
  // :scope > tr restricts the match to direct children of tbody. Plain
  // 'tr:not(.pr-comments)' matches ANY descendant <tr>, including the
  // individual comment rows nested inside each PR's collapsed per-comment
  // sub-table — sweeping those into the sort and appendChild() then rips
  // them out of their nested table into the outer tbody, corrupting it.
  const rows = Array.from(tbody.querySelectorAll(':scope > tr:not(.pr-comments)'));
  // Capture each row's comment sibling before any DOM moves — appendChild()
  // relocates an already-attached node immediately, so reading
  // nextElementSibling *after* moving a row always returns null.
  const commentRowFor = new Map();
  rows.forEach(row => {
    const nx = row.nextElementSibling;
    if (nx && nx.classList.contains('pr-comments')) commentRowFor.set(row, nx);
  });
  // Prefer data-sort-value over displayed text — "14 days ago"/"Yesterday"
  // and "#9" vs "#10" don't sort correctly as strings (lexicographic, not
  // numeric/chronological). ISO date strings sort correctly as plain
  // strings, so only pure-digit values (PR numbers) need numeric compare.
  const cellSortValue = cell => {
    const v = cell.getAttribute('data-sort-value');
    return v !== null ? v : cell.textContent.trim();
  };
  rows.sort((a, b) => {
    let aV = cellSortValue(a.cells[colIdx]), bV = cellSortValue(b.cells[colIdx]);
    if (aV === '—' || aV === '') aV = asc ? '\uffff' : '';
    if (bV === '—' || bV === '') bV = asc ? '\uffff' : '';
    if (/^\d+$/.test(aV) && /^\d+$/.test(bV)) {
      return asc ? Number(aV) - Number(bV) : Number(bV) - Number(aV);
    }
    return asc ? aV.localeCompare(bV) : bV.localeCompare(aV);
  });
  rows.forEach(row => {
    tbody.appendChild(row);
    const commentRow = commentRowFor.get(row);
    if (commentRow) tbody.appendChild(commentRow);
  });
}

// ==== SECTION: BOOTSTRAP (initial render + auto-refresh on load) ====
renderPage();

// Auto-fetch live data on every load/reload so PR data and relative-age
// labels ("3 hours ago"/"Yesterday") are never stale from a previous
// session — this is what a plain reload used to skip, only re-hydrating
// the old cache. Skipped when no token is set yet: first-time setup still
// requires an explicit "Refresh" click, which opens the Settings modal —
// a fresh page load shouldn't throw that modal up unprompted either.
if (getGithubToken()) {
  handleGitLiveRefresh();
}
</script>
</body>
</html>
